[tool.poetry]
name = "zen-bot"
version = "2.0.0"
description = "A calm Discord companion for healthier online communities"
authors = ["Jamie G"]
readme = "README.md"
packages = [{ include = "zenbot" }]

[tool.poetry.dependencies]
python = "^3.9"
"discord.py" = "^2.7.1"
python-dotenv = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
ruff = "^0.12.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
